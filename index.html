<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>360°深耕奇美・報到</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  body { background: linear-gradient(170deg, #E6F3EE 0%, #FFF6E8 45%, #FDEDEA 100%); min-height: 100vh; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 120px; min-height: 100vh; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-family: var(--font-round); font-size: 20px; color: var(--leaf-deep); }
  .brand small { display: block; font-family: var(--font); font-size: 11px; color: var(--ink-soft); }
  .me-pill { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 3px 12px 3px 3px; box-shadow: var(--shadow); font-size: 13px; }
  .me-pill svg { width: 30px; height: 36px; }

  /* 歡迎 */
  .hero { position: relative; border-radius: 26px; overflow: hidden; aspect-ratio: 1/1; background: url(assets/kv.jpg) center/cover; box-shadow: var(--shadow); }
  .hero .ttl { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 22px 22px; background: linear-gradient(transparent, rgba(255,250,240,.96) 55%); }
  .hero h1 { margin: 0; font-size: 40px; color: var(--leaf-deep); letter-spacing: .08em; }
  .hero p { margin: 4px 0 0; color: var(--ink-soft); }
  .steps { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 18px 0; text-align: center; font-size: 12px; color: var(--ink-soft); }
  .steps b { display: block; font-size: 24px; margin-bottom: 2px; }

  /* 選人物 */
  .label { font-weight: 700; margin: 16px 0 8px; display: block; }
  .name-input { width: 100%; font-size: 18px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: #fff; outline: none; }
  .name-input:focus { border-color: var(--leaf); }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters .chip { flex: none; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .av { position: relative; background: #fff; border: 2.5px solid transparent; border-radius: 16px; padding: 6px 2px; }
  .av svg { width: 100%; height: auto; display: block; }
  .av.on { border-color: var(--leaf-deep); background: #F1FAF2; color: var(--ink); }
  .av .taken { position: absolute; top: 4px; right: 4px; background: var(--sand); color: #6B4E12; border-radius: 999px; font-size: 10px; padding: 1px 6px; }
  .sticky { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(255,249,238,.98) 30%); }
  .sticky .inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .sticky .btn { flex: 1; }
  .preview { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .preview svg { width: 44px; height: 53px; }

  /* 抽卡 */
  .stage { text-align: center; padding-top: 20px; }
  .flip { perspective: 1000px; width: 230px; height: 320px; margin: 24px auto; }
  .flip .in { position: relative; width: 100%; height: 100%; transition: transform .9s cubic-bezier(.3,1.4,.5,1); transform-style: preserve-3d; }
  .flip.done .in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(60,80,60,.18); }
  .back { background: radial-gradient(circle at 50% 35%, #FFFDF5, #F8DA92); color: var(--leaf-deep); font-family: var(--font-round); font-size: 80px; border: 6px solid #fff; }
  .back small { font-size: 15px; font-family: var(--font); color: #8A6A2A; margin-top: 6px; }
  .front { transform: rotateY(180deg); color: #fff; border: 6px solid #fff; }
  .front .no { font-family: var(--font-round); font-size: 76px; line-height: 1; }
  .front .t { font-family: var(--font-round); font-size: 36px; margin-top: 6px; }
  .front .s { font-size: 16px; opacity: .9; margin-top: 4px; }
  .wiggle { animation: floaty 2.2s ease-in-out infinite; }

  /* 填寫 */
  .fieldhead { border-radius: 20px; color: #fff; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
  .fieldhead .no { font-family: var(--font-round); font-size: 40px; background: rgba(255,255,255,.22); border-radius: 14px; padding: 2px 12px; }
  .fieldhead .t { font-family: var(--font-round); font-size: 24px; }
  .fieldhead .q { font-size: 14px; opacity: .95; }
  .scaffold { margin: 14px 0 4px; background: #fff; border-radius: 16px; padding: 14px; font-size: 15px; line-height: 2; color: var(--ink-soft); box-shadow: var(--shadow); }
  .scaffold .slot { color: var(--ink-soft); border-bottom: 2px dotted #C9BFAE; padding: 0 4px; }
  .scaffold .mine { color: #fff; border-radius: 8px; padding: 2px 8px; font-weight: 700; }
  textarea.word { width: 100%; font-size: 20px; padding: 14px; min-height: 84px; border-radius: 14px; border: 2px solid var(--line); outline: none; resize: none; }
  textarea.word:focus { border-color: var(--leaf); }
  .count { text-align: right; font-size: 12px; color: var(--ink-soft); }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; }
  .scopes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .scope-btn { border: 2px solid transparent; border-radius: 14px; padding: 10px; text-align: left; background: #fff; font-size: 14px; line-height: 1.35; }
  .scope-btn b { display: block; font-size: 12px; }
  .scope-btn.on { color: #fff; }

  /* 首頁 */
  .seed { display: flex; gap: 14px; align-items: center; }
  .seed svg { width: 84px; height: 101px; flex: none; animation: floaty 3s ease-in-out infinite; }
  .tagf { display: inline-block; color: #fff; border-radius: 8px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
  .word-big { font-family: var(--font-round); font-size: 24px; margin: 6px 0; word-break: break-all; }
  .status { margin: 16px 0; text-align: center; font-size: 15px; color: var(--ink-soft); }
  .status b { color: var(--leaf-deep); }
  .sent { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .sent .text { font-size: 17px; line-height: 1.7; }
  .sent .text mark { background: #FFE9A8; border-radius: 4px; padding: 0 3px; }
  .sent .meta { font-size: 12px; color: var(--ink-soft); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
  .water { display: flex; align-items: center; gap: 6px; }
  .water button { width: 40px; height: 40px; border-radius: 50%; border: 0; font-size: 20px; background: #E3F1FB; color: #2F6FC4; }
  .water button:disabled { opacity: .35; }
  .water .n { min-width: 46px; text-align: center; font-size: 18px; }
  .drops { position: sticky; top: 0; z-index: 3; background: rgba(255,249,238,.95); backdrop-filter: blur(6px); padding: 10px 0; text-align: center; font-size: 16px; }
  .drops .d { font-size: 26px; letter-spacing: 4px; }
  .rank { font-family: var(--font-round); font-size: 22px; color: var(--sand-deep); margin-right: 6px; }
  /* 選範疇 */
  .scope-big { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 2.5px solid var(--soft); background: var(--soft); border-radius: 18px; padding: 14px; margin-bottom: 10px; font-size: 17px; color: var(--ink); }
  .scope-big .em { font-size: 30px; }
  .scope-big b { display: block; font-size: 13px; color: var(--c); }
  .scope-big small { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
  .scope-big.on { background: var(--c); border-color: var(--c); color: #fff; }
  .scope-big.on b, .scope-big.on small { color: #fff; }
  /* 六欄填寫 */
  .scopebar { color: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .example { background: #FFFBEF; border: 1.5px dashed #E8C877; border-radius: 14px; padding: 10px 12px; margin: 10px 0; font-size: 14px; line-height: 1.8; }
  .example .exh { font-size: 12px; color: #9A7A2A; font-weight: 700; }
  .scaffold .pv { border-radius: 6px; padding: 1px 5px; border-bottom: 2px dotted #C9BFAE; }
  .fblock { background: #fff; border-radius: 16px; padding: 12px; margin-top: 12px; box-shadow: var(--shadow); border-left: 6px solid var(--c); }
  .fh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .fh .fn { font-family: var(--font-round); color: #fff; background: var(--c); border-radius: 8px; padding: 0 7px; font-size: 15px; }
  .fh .ft { font-weight: 700; font-size: 17px; color: var(--c); }
  .fh .fs { font-size: 12px; color: var(--ink-soft); }
  .finput { width: 100%; font-size: 17px; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line); outline: none; margin-bottom: 8px; font-family: inherit; }
  .finput:focus { border-color: var(--c); }
  .fblock .chip.on { background: var(--c); border-color: var(--c); color: #fff; }
  .mysent { font-size: 16px; line-height: 1.75; margin: 6px 0; }
  .sent.minebox { box-shadow: 0 0 0 3px #E8B84A, var(--shadow); }
  .mapbtn { display: block; text-align: center; text-decoration: none; margin: 14px 0 4px; background: #1E6F5C; box-shadow: 0 4px 0 #134A3D; }
  .link-btn { background: none; border: 0; color: var(--teal); text-decoration: underline; font-size: 14px; padding: 8px; }

  /* 院區導覽 */
  .sheet { position: fixed; inset: 0; background: rgba(40,50,40,.35); z-index: 20; display: flex; align-items: flex-end; }
  .sheet .panel { background: var(--cream); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 24px 24px 0 0; max-height: 86vh; overflow-y: auto; padding: 20px 16px 40px; }
  .scope-card { border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .scope-card h3 { margin: 0 0 6px; font-size: 19px; }
  .item { display: block; width: 100%; text-align: left; background: rgba(255,255,255,.75); border: 0; border-radius: 10px; padding: 9px 10px; margin-top: 6px; font-size: 14px; }
  .item .rel { display: none; font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .item.open .rel { display: block; }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; animation: pop .3s; }
  .offline { background: #C9475B; color: #fff; text-align: center; font-size: 13px; padding: 6px; border-radius: 10px; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app"><p class="status">載入中…</p></div>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/avatars.js"></script>
<script src="js/store.js"></script>
<script src="js/participant.js"></script>
</body>
</html>
