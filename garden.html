<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7FBF6A">
<title>共識花園・360°深耕奇美</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  :root { --gold: #C9A24E; --teal: #1E6F5C; --grass1: #9BD17E; --grass2: #7FBF6A; --soil: #8C6A45; --wood: #B98A5E; --drop: #3E95E0; }
  html, body { height: 100%; }
  body { background: var(--grass2); overscroll-behavior-y: none; }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100%; background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 2px, transparent 3px) 0 0/38px 38px,
      radial-gradient(circle at 70% 70%, rgba(60,120,50,.18) 0 2px, transparent 3px) 0 0/46px 46px,
      linear-gradient(180deg, #BFE3A6 0, var(--grass1) 180px, var(--grass2) 100%);
    padding-bottom: calc(30px + env(safe-area-inset-bottom)); }

  /* 上方狀態列（遊戲 HUD） */
  .hud { position: sticky; top: 0; z-index: 10; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: rgba(255,252,244,.96); border-bottom: 3px solid var(--gold); box-shadow: 0 6px 18px rgba(40,70,30,.18); }
  .hrow { display: flex; align-items: center; gap: 8px; }
  .back { border: 0; background: #F1EADC; border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700; color: #22302B; text-decoration: none; white-space: nowrap; }
  .ttl { flex: 1; font-family: var(--font-round); font-size: 21px; color: var(--teal); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttl small { display: block; font-family: var(--font); font-size: 10px; letter-spacing: .2em; color: #B08A3E; font-weight: 700; }
  .meav { width: 40px; height: 48px; flex: none; }
  .meav svg { width: 100%; height: 100%; }
  .meters { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; margin-top: 8px; }
  .dropbar { display: flex; align-items: center; gap: 2px; background: #EAF4FC; border-radius: 999px; padding: 4px 10px 4px 8px; min-width: 0; }
  .dropbar .lb { font-size: 12px; font-weight: 700; color: #2F6FC4; margin-right: 4px; white-space: nowrap; }
  .dropbar .dd { width: 13px; height: 17px; flex: 0 1 auto; min-width: 8px; transition: transform .3s; }
  @media (max-width: 380px) { .dropbar .lb { display: none; } .bloomcount { padding: 4px 8px; } }
  .dropbar .dd.off { opacity: .22; filter: grayscale(1); }
  .dropbar .dd.used { animation: dropuse .5s; }
  @keyframes dropuse { 40% { transform: translateY(-6px) scale(1.3); } }
  .dropbar .nn { flex: none; margin-left: auto; font-weight: 900; color: #2F6FC4; font-size: 15px; padding-left: 6px; white-space: nowrap; }
  .bloomcount { font-size: 12px; font-weight: 700; color: #7A5A1A; background: #FFF1CF; border: 1.5px solid #E8C877; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .bloomcount b { font-size: 15px; color: #C2410C; }
  .banner { margin: 10px 12px 0; background: rgba(255,255,255,.9); border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.55; box-shadow: 0 3px 0 rgba(60,110,40,.25); }
  .banner b { color: var(--teal); }

  /* 廣場切換與篩選 */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 12px 0; }
  .tab { border: 0; border-radius: 16px; padding: 10px 6px; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.55); color: #2F4A2A; box-shadow: 0 3px 0 rgba(60,110,40,.25); }
  .tab small { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
  .tab.on { background: #FFFCF4; color: var(--teal); box-shadow: 0 0 0 3px var(--gold), 0 4px 0 rgba(60,110,40,.3); }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 2px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters .chip { flex: none; background: rgba(255,255,255,.75); border-color: transparent; font-size: 13px; padding: 6px 11px; }
  .filters .chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }

  /* 花園格子 */
  .field { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
  @media (min-width: 440px) { .field { grid-template-columns: repeat(4, 1fr); } }
  .plot { position: relative; border: 0; background: rgba(255,255,255,.28); border-radius: 18px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; box-shadow: inset 0 -4px 0 rgba(60,110,40,.18); font-family: inherit; color: inherit; transition: transform .12s; }
  .plot:active { transform: scale(.95); }
  .plot .art { width: 100%; aspect-ratio: 72/88; display: flex; align-items: flex-end; justify-content: center; }
  .plot .art svg { width: 92%; height: auto; overflow: visible; }
  .plot .pct { position: absolute; top: 6px; right: 6px; background: #fff; color: #2F6FC4; font-weight: 900; font-size: 11px; border-radius: 999px; padding: 1px 7px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .plot.bloom .pct { background: #FFD34D; color: #7A4A00; }
  .plot .nm { margin-top: 2px; font-size: 12px; font-weight: 700; background: var(--wood); color: #fff; border-radius: 6px; padding: 1px 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: 0 2px 0 #8A6440; }
  .plot .bar { width: 80%; height: 5px; background: rgba(0,0,0,.12); border-radius: 999px; margin-top: 5px; overflow: hidden; }
  .plot .bar i { display: block; height: 100%; background: linear-gradient(90deg, #6FB6F2, #2F6FC4); border-radius: 999px; transition: width .5s; }
  .plot.bloom .bar i { background: linear-gradient(90deg, #FFD34D, #F59E0B); }
  .plot.mine { background: rgba(255,248,220,.6); box-shadow: 0 0 0 3px #E8B84A, inset 0 -4px 0 rgba(60,110,40,.18); }
  .plot.mine::before { content: "我的"; position: absolute; top: 6px; left: 6px; background: #E8B84A; color: #3A2A00; font-size: 10px; font-weight: 900; border-radius: 6px; padding: 1px 6px; }
  .plot .gave { position: absolute; left: 6px; bottom: 30px; font-size: 11px; font-weight: 900; color: #2F6FC4; background: rgba(255,255,255,.9); border-radius: 999px; padding: 0 6px; }
  .plot.mine .gave { bottom: 30px; }
  .plot.grow .art svg { animation: growpop .7s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 95%; }
  @keyframes growpop { 0% { transform: scale(.75); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .fart .spk { animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .25; } }
  .empty { grid-column: 1 / -1; text-align: center; color: #2F4A2A; background: rgba(255,255,255,.6); border-radius: 16px; padding: 24px 12px; font-size: 14px; }

  /* 花朵卡（底部彈出） */
  .shade { position: fixed; inset: 0; background: rgba(30,50,25,.42); z-index: 30; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .card2 { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: #FFFCF4; border-radius: 26px 26px 0 0; border-top: 4px solid var(--gold); padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); animation: up .32s cubic-bezier(.3,1.2,.5,1); }
  @keyframes up { from { transform: translateY(60%); } }
  .card2 .x { position: absolute; right: 12px; top: 10px; border: 0; background: #F1EADC; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: #5A5148; z-index: 2; }
  .handle { width: 44px; height: 5px; border-radius: 999px; background: #E2D6BE; margin: 0 auto 6px; }
  .stagebox { position: relative; height: 210px; border-radius: 20px; background: radial-gradient(ellipse at 50% 100%, #9BD17E 0 45%, transparent 46%), linear-gradient(180deg, #E8F6FF, #F4FBEA); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .stagebox .big { width: 170px; height: 200px; display: flex; align-items: flex-end; justify-content: center; }
  .stagebox .big svg { width: 100%; height: auto; overflow: visible; }
  .stagebox.grow .big svg { animation: growpop .8s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 95%; }
  .stagebox .can { position: absolute; left: 50%; top: 14px; width: 92px; margin-left: -120px; opacity: 0; transform: rotate(0); transform-origin: 30% 70%; }
  .stagebox.pour .can { animation: canpour 1.3s ease-in-out; }
  @keyframes canpour { 0% { opacity: 0; transform: translate(-30px, -10px) rotate(0); } 18% { opacity: 1; transform: translate(0,0) rotate(0); } 35%, 75% { opacity: 1; transform: rotate(32deg); } 100% { opacity: 0; transform: rotate(0) translate(-20px, -10px); } }
  .stagebox .wd { position: absolute; width: 9px; height: 12px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #6FB6F2; border: 1.5px solid #fff; opacity: 0; }
  .stagebox.pour .wd { animation: wdrop .7s ease-in forwards; }
  @keyframes wdrop { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(110px); } }
  .plus { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-family: var(--font-round); font-size: 30px; color: #2F6FC4; text-shadow: 0 2px 0 #fff, 0 0 8px #fff; pointer-events: none; animation: plus 1.2s ease-out forwards; }
  @keyframes plus { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -50px) scale(1); } }
  .petal { position: fixed; width: 12px; height: 16px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; z-index: 60; pointer-events: none; animation: petal 2.2s ease-out forwards; }
  @keyframes petal { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }
  .stagelabel { text-align: center; margin: 10px 0 4px; font-family: var(--font-round); font-size: 20px; color: #2F4A2A; }
  .stagelabel b { color: #2F6FC4; }
  .bloomtxt { color: #C2410C !important; }
  .steps6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 6px 0 12px; }
  .steps6 div { text-align: center; font-size: 11px; font-weight: 700; color: #9AA59A; }
  .steps6 div i { display: block; height: 10px; border-radius: 999px; background: #E3E9DF; margin-bottom: 3px; }
  .steps6 div.on { color: #2F6FC4; }
  .steps6 div.on i { background: linear-gradient(90deg, #6FB6F2, #2F6FC4); }
  .steps6.full div.on i { background: linear-gradient(90deg, #FFD34D, #F59E0B); }
  .steps6.full div.on { color: #C2410C; }
  .author { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px dashed #E2D6BE; }
  .author svg { width: 42px; height: 50px; flex: none; }
  .author b { display: block; font-size: 17px; }
  .author span { font-size: 13px; color: var(--ink-soft); }
  .author .tg { margin-left: auto; color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .said { font-size: 17px; line-height: 1.8; background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 2px 10px rgba(80,70,40,.08); }
  .said .w { font-weight: 700; border-radius: 6px; padding: 0 4px; color: #fff; }
  .waterbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; border: 0; border-radius: 999px; padding: 15px; font-size: 19px; font-weight: 900; letter-spacing: .06em; color: #fff; background: linear-gradient(180deg, #5AAEF0, #2F7FD0); box-shadow: 0 5px 0 #1F5C9E; font-family: inherit; }
  .waterbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1F5C9E; }
  .waterbtn:disabled { background: #C9D3DA; box-shadow: 0 5px 0 #A9B3BA; color: #fff; }
  .waterbtn.done { background: linear-gradient(180deg, #FFD34D, #F59E0B); box-shadow: 0 5px 0 #B86F00; color: #5A3500; }
  .hint { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .mygave { text-align: center; font-size: 13px; color: #2F6FC4; margin-top: 6px; font-weight: 700; }
  .toast { top: auto; bottom: calc(30px + env(safe-area-inset-bottom)); }
  .gate { max-width: 360px; margin: 30vh auto 0; text-align: center; background: #FFFCF4; border-radius: 22px; padding: 24px; }
</style>
</head>
<body>
<div class="wrap" id="g"><div class="gate">載入中…</div></div>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/avatars.js"></script>
<script src="js/store.js"></script>
<script src="js/flowerart.js"></script>
<script src="js/garden.js"></script>
</body>
</html>
