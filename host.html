<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360°深耕奇美・主持人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/bigtree.css">
<style>
  body { background: #F6F3EA; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  header h1 { margin: 0; color: var(--leaf-deep); font-size: 28px; }
  header a { color: var(--teal); font-size: 14px; margin-left: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .card h2 { margin: 0 0 10px; font-size: 19px; }
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ph { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 6px; text-align: center; font-size: 14px; }
  .ph b { display: block; font-size: 22px; }
  .ph.on { border-color: var(--leaf-deep); background: #EAF6EC; font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .num { font-family: var(--font-round); font-size: 30px; color: var(--leaf-deep); }
  .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .bar { border-radius: 10px; color: #fff; text-align: center; padding: 6px 2px; font-size: 12px; }
  .bar b { display: block; font-size: 20px; }
  .tourbtns .chip { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  td svg { width: 30px; height: 36px; }
  .tag { color: #fff; border-radius: 6px; padding: 1px 6px; font-size: 12px; white-space: nowrap; }
  .sent { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .sent.on { background: #FFF5D6; border-radius: 8px; }
  .sent .tx { flex: 1; }
  .plist { max-height: 560px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
  .prow { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px dashed var(--line); }
  .prow.on { background: #F1FAF2; }
  .prow .ck input { width: 20px; height: 20px; }
  .prow .pmain { flex: 1; min-width: 0; }
  .prow .edit { width: 100%; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; font-family: inherit; }
  .prow .edit:hover { border-color: var(--line); background: #fff; }
  .prow .edit:focus { border-color: var(--leaf); background: #fff; outline: none; }
  .gate { max-width: 360px; margin: 18vh auto; text-align: center; }
  .gate input { font-size: 22px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); width: 100%; text-align: center; margin: 12px 0; }
  .note { font-size: 13px; color: var(--ink-soft); }
  .msg { margin-top: 8px; font-size: 14px; color: #C9475B; }
</style>
</head>
<body>
<div id="gate" class="gate card">
  <h2>🔐 主持人控制台</h2>
  <input id="pin" type="password" inputmode="numeric" placeholder="輸入密碼">
  <button class="btn" id="enter" style="width:100%">進入</button>
  <p class="note" id="gmsg"></p>
</div>
<div class="wrap hide" id="main"></div>
<div class="wrap hide" id="treewrap" style="padding-top:0"><div class="card"><h2 style="margin:0 0 6px">🌳 共識大樹預覽</h2><p class="note" id="treenote" style="margin:0 0 10px"></p><div class="row" style="margin:0 0 10px"><button class="btn small" id="tree-sim">💧 模擬澆水（看完成的樹）</button><button class="btn small ghost" id="tree-clear">清除澆水</button></div><div id="treebox"></div></div></div>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/avatars.js"></script>
<script src="js/store.js"></script>
<script src="js/bigtree.js"></script>
<script src="js/host.js"></script>
</body>
</html>
